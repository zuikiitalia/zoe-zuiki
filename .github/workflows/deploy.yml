name: Deploy to Cloudflare

# Quando girare:
# - Push su main (= ogni PR mergeata) → test + typecheck + deploy
# - Pull request verso main → solo test + typecheck (gate per branch protection, niente deploy)
# - Manualmente da Actions UI (workflow_dispatch) → utile per redeploy senza nuovo commit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Concurrency: cancella i run obsoleti dello stesso ref. Push e PR hanno ref diversi
# quindi non si cancellano a vicenda; due push ravvicinati su main sì.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run tests (gate)
        run: npx vitest run

      - name: Typecheck (gate)
        run: npx tsc --noEmit

      # Deploy SOLO su push a main (o workflow_dispatch). Per le PR si fa solo gate.
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Summary
        if: always()
        run: |
          echo "### CI result" >> $GITHUB_STEP_SUMMARY
          echo "- Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: \`${GITHUB_SHA::7} - ${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "- Worker URL: https://zoe-zuiki.simone-8d7.workers.dev" >> $GITHUB_STEP_SUMMARY
          fi
